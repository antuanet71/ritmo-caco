<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Ritmo CACO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E1A16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: una columna estrecha tipo app; la pantalla de carrera ocupa todo y se tiñe del color del intervalo */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --surface-2:#F6F8F6; --ink:#13201A; --muted:#5A6B63; --line:#D3DDD7;
  --accent:#E8590C; --accent-ink:#FFFFFF; --warn-bg:#FFF3D6; --warn-ink:#6B4A00; --warn-line:#F2D48A;
  --walk:#0F9E8A; --run-easy:#E58A0B; --run:#E8590C; --run-hard:#D9304F; --mob:#7251E0; --rest:#4F6170;
  --f-display:'Barlow Condensed','Roboto Condensed','Arial Narrow',sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#16201C; --surface-2:#1C2823; --ink:#E7EFEA; --muted:#93A59C; --line:#2A3832;
  --accent:#FF6B2C; --accent-ink:#140A04; --warn-bg:#2E2510; --warn-ink:#F3D58A; --warn-line:#5A4718; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#16201C; --surface-2:#1C2823; --ink:#E7EFEA; --muted:#93A59C; --line:#2A3832;
  --accent:#FF6B2C; --accent-ink:#140A04; --warn-bg:#2E2510; --warn-ink:#F3D58A; --warn-line:#5A4718; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 128px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:2.3rem;font-weight:800;letter-spacing:.01em;text-transform:uppercase}
h2{font-size:1.35rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
h3{font-size:1.2rem;font-weight:700}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{flex:1}
.num{font-variant-numeric:tabular-nums}

.topbar{display:flex;align-items:center;gap:10px;padding-block:6px 14px}
.brand{display:flex;flex-direction:column}
.brand .mark{display:flex;gap:3px;margin-top:6px}
.brand .mark i{height:6px;border-radius:3px}
.iconbtn{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;background:var(--surface-2);border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.big{min-height:64px;font-size:1.15rem;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--run-hard)}
.btn svg{width:20px;height:20px}

.cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;border-radius:var(--r);background:var(--ink);color:var(--bg);border:0;min-height:84px}
.cta .ic{width:48px;height:48px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.cta .ic svg{width:26px;height:26px}
.cta b{font-family:var(--f-display);font-size:1.35rem;text-transform:uppercase;letter-spacing:.03em;display:block;line-height:1.1}
.cta span{font-size:.9rem;opacity:.75}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.wcard .t{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.1}
.wcard .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.9rem;color:var(--muted)}
.wcard .actions{display:flex;gap:8px}
.wcard .actions .btn{flex:1}

.tl{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface-2)}
.tl i{display:block;min-width:2px}
.tl.big{height:22px;border-radius:8px}
.t-walk{--c:var(--walk)} .t-run-easy{--c:var(--run-easy)} .t-run{--c:var(--run)} .t-run-hard{--c:var(--run-hard)} .t-mobility{--c:var(--mob)} .t-rest{--c:var(--rest)}
.tl i{background:var(--c)}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--c)}

.banner{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line);border-radius:var(--r);padding:12px 14px;font-size:.95rem}
.banner ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.banner b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em}

textarea{width:100%;min-height:42vh;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:14px;font-size:.95rem;resize:vertical;box-sizing:border-box}
input[type=text],input[type=number],select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:46px;box-sizing:border-box;min-width:0}
.title-input{width:100%;font-family:var(--f-display);font-size:1.6rem;font-weight:700;border:0;border-bottom:2px solid var(--line);border-radius:0;background:transparent;padding:6px 0}

.summary{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.summary .big{font-family:var(--f-display);font-size:3rem;font-weight:800;line-height:.9}
.summary .lbl{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}

.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;align-items:baseline;gap:10px;padding-top:8px;border-top:2px solid var(--line)}
.sec-h .dur{margin-left:auto;font-family:var(--f-display);font-size:1.15rem;font-weight:700}
.sec-h .decl{font-size:.8rem;color:var(--muted)}
.iv{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:8px}
.iv .r2{grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.iv select{font-weight:700;color:var(--c);padding-inline:8px}
.iv input{width:100%}
.iv .del{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--muted);font-size:1.4rem;line-height:1}
.field{display:flex;flex-direction:column;gap:2px}
.field small{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;padding-left:2px}
.field .hint{font-size:.78rem;color:var(--muted);text-transform:none;letter-spacing:0;font-weight:500}
.grp{border:2px dashed var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px}
.grp-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grp-h .x{font-family:var(--f-display);font-size:1.4rem;font-weight:800}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{width:42px;height:44px;border:0;background:transparent;font-size:1.3rem;font-weight:700}
.stepper input{width:52px;text-align:center;border:0;border-radius:0;min-height:44px;font-weight:700;font-size:1.1rem;padding:0}
.addrow{display:flex;gap:8px;flex-wrap:wrap}
.addrow .btn{min-height:40px;padding:8px 12px;font-size:.9rem}
details.src{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
details.src summary{cursor:pointer;font-weight:600}
details.src pre{white-space:pre-wrap;font-family:var(--f-body);font-size:.85rem;color:var(--muted);margin:8px 0 0}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .in{max-width:640px;margin:0 auto;display:flex;gap:8px}
.dock .btn{flex:1}
.dock .btn.primary{flex:2}

/* hoja de ajustes */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.set{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.set label{font-weight:600}
.set small{display:block;color:var(--muted);font-weight:400;font-size:.85rem}
.switch{appearance:none;-webkit-appearance:none;width:54px;height:32px;border-radius:16px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.switch:checked{background:var(--walk)}
.switch:checked::after{transform:translateX(22px)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-weight:700;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.info{font-size:.92rem;color:var(--muted)}
.info h3{color:var(--ink);font-size:1.05rem;margin:6px 0 4px}
.info p{margin:0 0 8px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);box-sizing:border-box;text-align:center}

/* ---------- pantalla de carrera ---------- */
.run{position:fixed;inset:0;z-index:40;--c:var(--run);background:var(--c);color:#fff;display:grid;grid-template-rows:auto 1fr auto;transition:background .5s;
  padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
.run::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 0%,rgba(255,255,255,.18),transparent 60%),linear-gradient(180deg,transparent 55%,rgba(0,0,0,.28));pointer-events:none}
.run>*{position:relative;max-width:560px;width:100%;margin:0 auto}
.run .head{display:flex;align-items:center;gap:10px}
.run .head .sec{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:1rem;opacity:.9;display:block}
.run .head .blk{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1}
.run .rbtn{width:48px;height:48px;border-radius:14px;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;flex:none}
.run .rbtn svg{width:24px;height:24px}
.run .mid{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px;min-height:0}
.run .kind{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(2rem,10vw,3.4rem);line-height:.95;letter-spacing:.01em}
.run .clock{font-family:var(--f-display);font-weight:800;font-size:clamp(5.5rem,34vw,12rem);line-height:.85;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.run .sub{font-size:1.1rem;font-weight:600;opacity:.9}
.run .rpe{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border-radius:999px;padding:6px 14px;font-weight:700;font-size:1.05rem}
.run .rpe .dots{display:flex;gap:3px}
.run .rpe .dots i{width:7px;height:14px;border-radius:2px;background:rgba(255,255,255,.3)}
.run .rpe .dots i.on{background:#fff}
.run .bar{width:100%;height:12px;border-radius:6px;background:rgba(0,0,0,.25);overflow:hidden;margin-top:10px}
.run .bar i{display:block;height:100%;background:#fff;border-radius:6px;width:0}
.run .next{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.24);border-radius:16px;padding:10px 14px;margin-top:14px;width:100%;box-sizing:border-box;text-align:left}
.run .next .sw{width:16px;height:40px;border-radius:6px;background:var(--nc,#fff);border:2px solid rgba(255,255,255,.7);flex:none}
.run .next .l{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;opacity:.8}
.run .next .v{font-family:var(--f-display);font-size:1.35rem;font-weight:700;line-height:1.1}
.run .foot{display:flex;flex-direction:column;gap:12px}
.run .tlrun{position:relative}
.run .tlrun .tl{height:16px;background:rgba(0,0,0,.2);border-radius:6px}
.run .tlrun .tl i{border:1px solid rgba(255,255,255,.55);box-sizing:border-box}
.run .tlrun .tl i.done{opacity:.35}
.run .tlrun .pos{position:absolute;top:-5px;width:4px;height:26px;background:#fff;border-radius:2px;box-shadow:0 0 0 2px rgba(0,0,0,.25);transform:translateX(-2px)}
.run .stats{display:flex;justify-content:space-between;font-weight:700;font-size:1rem}
.run .ctrls{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px}
.run .ctrls button{border:0;border-radius:18px;background:rgba(255,255,255,.2);color:#fff;min-height:76px;display:grid;place-items:center}
.run .ctrls button.main{background:#fff;color:var(--c)}
.run .ctrls svg{width:34px;height:34px}
.run.paused .clock{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.run{transition:none}.run.paused .clock{animation:none}}
.run .gpsd{font-family:var(--f-display);font-size:1.4rem;font-weight:700}
.run.done-screen .mid .clock{font-size:clamp(4rem,22vw,8rem)}

.pocket{position:fixed;inset:0;z-index:60;background:#000;color:#9aa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px;touch-action:none;user-select:none;-webkit-user-select:none}
.pocket .pc{font-family:var(--f-display);font-size:5rem;font-weight:800;color:#555;font-variant-numeric:tabular-nums}
.pocket .hold{width:96px;height:96px;border-radius:50%;border:3px solid #333;display:grid;place-items:center;color:#777;position:relative}
.pocket .hold svg{width:36px;height:36px}
.pocket .ring{position:absolute;inset:-3px;border-radius:50%;background:conic-gradient(#ccc var(--p,0%),transparent 0);-webkit-mask:radial-gradient(circle,transparent 45px,#000 46px);mask:radial-gradient(circle,transparent 45px,#000 46px)}
.confirm{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.confirm .box{background:var(--bg);color:var(--ink);border-radius:18px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.confirm .box .row .btn{flex:1}
</style>

<div class="wrap" id="view"></div>
<div class="dock" id="dock" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<section class="run" id="run" hidden aria-live="polite">
  <div class="head">
    <div><span class="sec" id="r-sec">Calentamiento</span><span class="blk num" id="r-blk"></span></div>
    <div class="spacer"></div>
    <button class="rbtn" id="r-voice" aria-label="Silenciar voz"></button>
    <button class="rbtn" id="r-lock" aria-label="Bloquear pantalla táctil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
    <button class="rbtn" id="r-stop" aria-label="Terminar"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button>
  </div>
  <div class="mid">
    <div class="kind" id="r-kind">Trote</div>
    <div class="sub" id="r-label"></div>
    <div class="clock" id="r-clock">0:00</div>
    <div class="gpsd" id="r-gps" hidden></div>
    <div class="rpe" id="r-rpe" hidden><span id="r-rpe-t"></span><span class="dots" id="r-dots"></span></div>
    <div class="bar"><i id="r-bar"></i></div>
    <div class="next" id="r-next"><div class="sw" id="r-nsw"></div><div><div class="l">Después</div><div class="v" id="r-nv"></div></div></div>
  </div>

    <div class="tlrun"><div class="tl" id="r-tl"></div><div class="pos" id="r-pos"></div></div>

    <div class="ctrls">
      <button id="r-prev" aria-label="Intervalo anterior"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="r-play" class="main" aria-label="Pausa"></button>
      <button id="r-next-btn" aria-label="Saltar intervalo"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
  </div>
</section>
<div class="pocket" id="pocket" hidden>
  <div class="pc" id="p-clock">0:00</div>
  <div id="p-kind" style="font-size:1.2rem;color:#777"></div>
  <div class="hold" id="p-hold"><div class="ring" id="p-ring"></div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/></svg></div>
  <div style="font-size:.9rem;color:#666">Mantén pulsado para desbloquear</div>
</div>
<div class="confirm" id="confirm" hidden></div>

<script type="text/plain" id="sample"></script>
<script>/* Parser de mensajes del entrenador -> estructura de intervalos (reglas, sin API) */
const RC = (() => {
  const strip = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const cleanLine = l => l.replace(/\\(.)/g, '$1')
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu, '')
    .replace(/ /g, ' ').trim();
  const isBullet = l => /^\s*[•●▪◦*]/.test(l);
  const stripBullet = l => l.replace(/^[\s•●▪◦*\-–—]+/, '').replace(/^\d+\s*[.)](?!\d)\s*/, '').replace(/^[\s•\-–—]+/, '').trim();

  const QRE = /(\d{1,2}):(\d{2})\s*(?:min(?:uto)?s?(?![a-zñ])|')?|(\d+(?:[.,]\d+)?)\s*(?:minutos?|mins?|')(?![a-zñáéíóú])(?:\s*(?:y\s*)?(\d+)\s*(?:segundos?|segs?|s|")(?![a-zñ]))?|(\d+)\s*(?:segundos?|segs?|")(?![a-zñ])|(\d+(?:[.,]\d+)?)\s*(km|kil[oó]metros?|metros?|mts?|m)(?![a-zñáéíóú])/gi;
  function findQty(text) {
    const out = []; QRE.lastIndex = 0; let m;
    while ((m = QRE.exec(text))) {
      const q = { i: m.index, end: m.index + m[0].length };
      if (m[1] !== undefined) q.dur = (+m[1]) * 60 + (+m[2]);

/* ---------- audio y voz ---------- */
let ac = null, keep = null;
function silentWav(secs = 2) {
  const sr = 8000, n = Math.round(sr * secs), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);

}

  try { if (!keep) { keep = new Audio(silentWav()); keep.loop = true; keep.volume = 0.05; } keep.play().catch(() => {}); } catch (e) {}
  try { if (S.duck && !duckEl) { duck(); } } catch (e) {}
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
function beep(kind) {

      duckEl.addEventListener('ended', () => { try { if (speechSynthesis.speaking) { duckEl.currentTime = 0; duckEl.play().catch(() => {}); } } catch (e) {} });
    }

}
async function wake() { try { if ('wakeLock' in navigator && !R.wl) { R.wl = await navigator.wakeLock.request('screen'); R.wl.addEventListener('release', () => R.wl = null); } } catch (e) { R.wl = null; } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !runEl.hidden && !R.done) { wake(); if (keep && keep.paused) keep.play().catch(() => {}); tick(); } });
function startGps() {
  R.gpsOn = false;

  R.gpsOn = true;
  try {
    R.watch = navigator.geolocation.watchPosition(p => {
      const c = p.coords; if (c.accuracy > 35) return;

      R.last = { latitude: c.latitude, longitude: c.longitude };
    }, () => { if (R.gpsOn) { R.gpsOn = false; toast('GPS no disponible: uso el tiempo estimado', 4000); } }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  } catch (e) { R.gpsOn = false; }
}
function hav(a, b) { const r = Math.PI / 180, dLa = (b.latitude - a.latitude) * r, dLo = (b.longitude - a.longitude) * r; const x = Math.sin(dLa / 2) ** 2 + Math.cos(a.latitude * r) * Math.cos(b.latitude * r) * Math.sin(dLo / 2) ** 2; return 12742000 * Math.asin(Math.sqrt(x)); }
function stopGps() { try { if (R.watch != null) navigator.geolocation.clearWatch(R.watch); } catch (e) {} R.watch = null; }
function stepDone(st) { return useGps(st) ? R.gd >= st.dist : elapsed() >= st.dur; }
function tick() {

  while (!R.paused && stepDone(st)) {
    if (useGps(st)) { R.t0 = Date.now(); R.gd = 0; } else R.t0 += st.dur * 1000;
    R.idx++; moved = true; R.pre = false; R.beeped = -1;
    if (R.idx >= R.steps.length) { finish(); return; }
    st = R.steps[R.idx];
    if (Date.now() - R.t0 > 3600e3) { R.t0 = Date.now(); }
  }
  if (moved) { beep('go'); announce(); persist(); mediaSession(); }
  if (!R.paused) {
    if (useGps(st)) {
      const remM = st.dist - R.gd;

    } else {
      const rem = st.dur - elapsed();

      if (rem <= 3.05 && rem > 0) { const k = Math.ceil(rem); if (k !== R.beeped) { R.beeped = k; beep('tick'); } }

}
function stepSpoken(st, full) {
  const p = [st.label || TYPE_NAME[st.type]];
  p.push(useGps(st) ? sayDist(st.dist) : (st.dist ? `${sayDist(st.dist)}, unos ${sayDur(st.dur)}` : sayDur(st.dur)));
  if (st.rpe && full !== false) p.push(`Esfuerzo ${sayRpe(st.rpe)} sobre 10`);
  return p.join('. ');
}
function announce(first) {
  const st = R.steps[R.idx], prev = R.steps[R.idx - 1], left = R.steps.length - R.idx - 1;
  const p = [];
  if (first) p.push('Empezamos');
  if (!prev || prev.section !== st.section) p.push(st.sectionName);
  if (st.b && st.b.first && S.detail === 'full') p.push(st.b.block === st.b.blocks ? `Último bloque, ${st.b.block} de ${st.b.blocks}` : `Bloque ${st.b.block} de ${st.b.blocks}`);
  p.push(stepSpoken(st));
  if (S.detail === 'full') p.push(left === 0 ? 'Es el último intervalo' : left === 1 ? 'Queda 1 intervalo después de este' : `Quedan ${left} intervalos después de este`);

function prewarn(when) {

  const sec = nx.section !== st.section ? `empieza ${nx.sectionName.toLowerCase()}: ` : (nx.b && nx.b.first && st.b ? `bloque ${nx.b.block}: ` : '');

function finish() {

  const tot = R.steps.reduce((a, s) => a + s.dur, 0);
  say(`Entrenamiento terminado. ${sayDur(tot)}. Buen trabajo.`, true);
  runEl.classList.add('done-screen'); runEl.classList.remove('paused');
  runEl.style.setProperty('--c', 'var(--walk)');
  $('#r-sec').textContent = R.w.title; $('#r-blk').textContent = '';
  $('#r-kind').textContent = '¡Hecho!'; $('#r-label').textContent = `${R.steps.length} intervalos completados`;
  $('#r-clock').textContent = fmt(tot); $('#r-rpe').hidden = true; $('#r-gps').hidden = true; $('#r-bar').style.width = '100%';
  $('#r-next').hidden = true; $('#r-pos').style.left = '100%'; $('#r-left').textContent = ''; $('#r-total').textContent = '';
  $('#r-play').innerHTML = ICON.play; $('#r-play').setAttribute('aria-label', 'Repetir');
  try { if (keep) keep.pause(); } catch (e) {}
  try { if (R.wl) R.wl.release(); } catch (e) {}
}
function closeRun() {
  clearInterval(R.timer); stopGps(); R.done = true;
  try { speechSynthesis.cancel(); } catch (e) {}
  try { if (keep) keep.pause(); } catch (e) {}
  try { if (R.wl) { R.wl.release(); R.wl = null; } } catch (e) {}
  runEl.hidden = true; $('#pocket').hidden = true; document.body.style.overflow = '';
  store.del('rc.active'); renderHome();
}
function persist(clear) {
  if (clear) { store.del('rc.active'); return; }
  store.set('rc.active', { wid: R.w.id, idx: R.idx, t0: R.t0, paused: R.paused, pe: R.paused ? R.pe : 0, at: Date.now() });
}
function togglePause() {
  if (R.done) { startRun(R.w); return; }
  if (R.paused) { R.paused = false; R.t0 = Date.now() - R.pe * 1000; primeAudio(); say('Seguimos', true); }
  else { R.pe = elapsed(); R.paused = true; say('Pausa', true); }
  persist(); render(); mediaSession();
}
function jump(d) {
  if (R.done) return;
  const e = elapsed();
  if (d < 0 && e > 5 && !useGps(R.steps[R.idx])) { /* reinicia el actual */ }
  else R.idx = Math.max(0, Math.min(R.steps.length - 1, R.idx + d));
  R.t0 = Date.now(); R.pe = 0; R.gd = 0; R.pre = false; R.beeped = -1;
  beep('go'); announce(); persist(); render(); mediaSession();
}
function render() {
  if (R.done) return;
  const st = R.steps[R.idx], nx = R.steps[R.idx + 1], e = elapsed();
  const gps = useGps(st);
  const rem = gps ? Math.max(0, st.dist - R.gd) : Math.max(0, st.dur - e);
  const frac = gps ? Math.min(1, R.gd / st.dist) : Math.min(1, e / st.dur);
  runEl.style.setProperty('--c', `var(--${tclass(st).slice(2).replace('mobility', 'mob')})`);
  runEl.classList.toggle('paused', R.paused);
  $('#r-sec').textContent = st.sectionName;
  $('#r-blk').textContent = st.b ? `Bloque ${st.b.block}/${st.b.blocks}` : '';
  $('#r-kind').textContent = TYPE_NAME[st.type];
  $('#r-label').textContent = st.label && st.label.toLowerCase() !== TYPE_NAME[st.type].toLowerCase() ? st.label : '';
  $('#r-clock').textContent = gps ? `${Math.round(rem)} m` : fmt(Math.ceil(rem));
  $('#r-gps').hidden = !st.dist; $('#r-gps').textContent = st.dist ? (gps ? `${Math.round(R.gd)} de ${st.dist} m · ${fmt(e)}` : `${st.dist} m estimados a tu ritmo`) : '';
  const n = rpeMax(st.rpe);
  $('#r-rpe').hidden = !st.rpe;
  if (st.rpe) { $('#r-rpe-t').textContent = `Esfuerzo ${st.rpe.replace('-', '–')}/10`; $('#r-dots').innerHTML = Array.from({ length: 10 }, (_, i) => `<i class="${i < n ? 'on' : ''}"></i>`).join(''); }
  $('#r-bar').style.width = (frac * 100).toFixed(1) + '%';
  $('#r-next').hidden = false;
  if (nx) { $('#r-nsw').style.setProperty('--nc', `var(--${tclass(nx).slice(2).replace('mobility', 'mob')})`); $('#r-nv').textContent = `${nx.label || TYPE_NAME[nx.type]} · ${nx.dist ? amountStr(nx) : fmt(nx.dur)}${nx.rpe ? ` · ${nx.rpe.replace('-', '–')}/10` : ''}`; }
  else { $('#r-nsw').style.setProperty('--nc', 'var(--walk)'); $('#r-nv').textContent = 'Fin del entrenamiento'; }
  const totalS = R.steps.reduce((a, s) => a + s.dur, 0);
  const doneS = R.steps.slice(0, R.idx).reduce((a, s) => a + s.dur, 0) + Math.min(st.dur, gps ? frac * st.dur : e);
  $('#r-pos').style.left = (doneS / totalS * 100).toFixed(2) + '%';
  [...$('#r-tl').children].forEach((el, i) => el.classList.toggle('done', i < R.idx));
  const left = R.steps.length - R.idx - 1;
  $('#r-left').textContent = left ? `Quedan ${left} intervalos` : 'Último intervalo';
  $('#r-total').textContent = `${fmt(totalS - doneS)} restante`;
  $('#r-play').innerHTML = R.paused ? ICON.play : ICON.pause; $('#r-play').setAttribute('aria-label', R.paused ? 'Seguir' : 'Pausa');
  $('#r-voice').innerHTML = S.voice ? ICON.voiceOn : ICON.voiceOff;
  if (!$('#pocket').hidden) { $('#p-clock').textContent = $('#r-clock').textContent; $('#p-kind').textContent = `${TYPE_NAME[st.type]} · quedan ${left}`; }
}
function mediaSession() {

    const st = R.steps[R.idx];

    navigator.mediaSession.setActionHandler('play', () => { if (R.paused) togglePause(); });
    navigator.mediaSession.setActionHandler('pause', () => { if (!R.paused) togglePause(); });

$('#r-play').onclick = togglePause;
$('#r-prev').onclick = () => jump(-1);
$('#r-next-btn').onclick = () => jump(1);

$('#r-stop').onclick = () => { if (R.done) { closeRun(); return; } askConfirm('¿Terminar el entrenamiento?', 'Terminar', closeRun, 'Seguir'); };
$('#r-lock').onclick = () => { $('#pocket').hidden = false; render(); };
(() => { // desbloqueo manteniendo pulsado
  const h = $('#p-hold'), ring = $('#p-ring'); let t0 = 0, raf = 0;
  const stop = () => { cancelAnimationFrame(raf); ring.style.setProperty('--p', '0%'); t0 = 0; };
  const loop = () => { const p = Math.min(1, (Date.now() - t0) / 1200); ring.style.setProperty('--p', (p * 100) + '%'); if (p >= 1) { stop(); $('#pocket').hidden = true; } else raf = requestAnimationFrame(loop); };

renderHome();
})();
</script>
